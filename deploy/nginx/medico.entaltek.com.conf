# Frontend estatico (build de Vite) para Kit del Medico de Primer Nivel
# Dominio: medico.entaltek.com
#
# Este archivo es la version HTTP (puerto 80) inicial. Despues de ejecutar:
#   sudo certbot --nginx -d medico.entaltek.com
# Certbot agrega automaticamente el bloque server TLS (443) y la redireccion
# 80 -> 443. No edites a mano lo que Certbot gestione.

server {
    listen 80;
    listen [::]:80;
    server_name medico.entaltek.com;

    # Raiz servida por el script de despliegue (symlink a la release activa)
    root /var/www/medico/current;
    index index.html;

    # Reto ACME para emision/renovacion de certificados (metodo webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Compresion de texto
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets con hash en el nombre (Vite): cache larga e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta desconocida cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index nunca se cachea, para que cada despliegue se vea de inmediato
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Encabezados de seguridad basicos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Limite de subida (esta app no sube archivos al servidor)
    client_max_body_size 1m;
}
