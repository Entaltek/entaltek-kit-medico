# Reverse proxy a la API FastAPI (Kit del Medico de Primer Nivel)
# Dominio: api-medico.entaltek.com
#
# La API corre en Docker Compose. Se recomienda publicar el puerto SOLO en
# loopback en backend/compose.yaml para que no quede expuesto a internet:
#
#   ports:
#     - "127.0.0.1:8000:8000"
#
# Asi unicamente Nginx (en la misma maquina) puede alcanzarla.
#
# Version HTTP (puerto 80) inicial. Tras:
#   sudo certbot --nginx -d api-medico.entaltek.com
# Certbot agrega el bloque TLS (443) y la redireccion 80 -> 443.

server {
    listen 80;
    listen [::]:80;
    server_name api-medico.entaltek.com;

    # Reto ACME para certificados
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Encabezados de seguridad basicos
    add_header X-Content-Type-Options "nosniff" always;

    # La API solo procesa JSON ligero (no datos clinicos persistidos)
    client_max_body_size 1m;
}
